<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lazarus Form Recovery</title>
  <style>
    :root {
      --bg-main: #121316;
      --bg-panel: #181A1F;
      --bg-row: #1B1E24;
      --bg-row-hover: #242831;
      --border: #2B303B;
      --border-subtle: #20242D;
      --text-main: #F3F4F6;
      --text-muted: #9CA3AF;
      --text-dim: #6B7280;
      --accent-primary: #5A67D8;
      --accent-hover: #6D7BF0;
      --danger: #E5484D;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-code: "JetBrains Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 400px;
      height: 520px;
      background: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-ui);
      font-size: 11px;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border);
      user-select: none;
      position: relative;
    }
    header {
      background: var(--bg-panel);
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .brand {
      font-weight: 700;
      letter-spacing: 0.8px;
      font-size: 11px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .brand-icon { color: var(--accent-primary); flex-shrink: 0; }
    .icon-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 4px;
      border-radius: 2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 150ms ease, background 150ms ease, color 150ms ease, transform 150ms ease;
    }
    .icon-btn:hover, .icon-btn.active {
      background: var(--bg-row-hover);
      color: var(--text-main);
      border-color: var(--accent-primary);
      transform: translateY(-1px);
    }
    .view-panel { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
    .view-panel.hidden { display: none !important; }
    .tab-bar {
      background: var(--bg-main);
      padding: 6px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .tab-btn {
      flex: 1;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: border-color 150ms ease, background 150ms ease, color 150ms ease, transform 150ms ease;
    }
    .tab-btn:hover {
      background: var(--bg-row-hover);
      color: var(--text-main);
      border-color: var(--accent-primary);
      transform: translateY(-1px);
    }
    .tab-btn.active {
      background: var(--bg-row-hover);
      color: var(--text-main);
      border-color: var(--accent-primary);
    }
    .badge-count {
      font-family: var(--font-code);
      font-size: 9px;
      background: rgba(255,255,255,0.1);
      padding: 1px 4px;
      border-radius: 2px;
    }
    .filter-bar {
      padding: 5px 10px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .filter-input {
      width: 100%;
      height: 24px;
      background: var(--bg-main);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 2px 8px;
      font-size: 11px;
      font-family: var(--font-ui);
      outline: none;
      border-radius: 2px;
      transition: border-color 150ms ease, transform 150ms ease;
    }
    .filter-input:focus, .filter-input:hover {
      border-color: var(--accent-primary);
      transform: translateY(-1px);
    }
    main {
      flex: 1;
      overflow-y: auto;
      background: var(--bg-main);
    }
    main::-webkit-scrollbar, .settings-container::-webkit-scrollbar { width: 4px; }
    main::-webkit-scrollbar-track { background: var(--bg-main); }
    main::-webkit-scrollbar-thumb { background: var(--border); }
    .item-row {
      border-bottom: 1px solid var(--border-subtle);
      border-top: 1px solid transparent;
      border-right: 1px solid transparent;
      border-left: 4px solid transparent;
      padding: 9px 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      background: var(--bg-row);
      cursor: pointer;
      transition: background 150ms ease, border-color 150ms ease, transform 150ms ease;
    }
    .item-row:hover {
      background: var(--bg-row-hover);
      border-top-color: var(--accent-primary);
      border-right-color: var(--accent-primary);
      border-bottom-color: var(--accent-primary);
      transform: translateY(-1px);
    }
    .item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .site-info {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .site-icon {
      width: 14px;
      height: 14px;
      border-radius: 2px;
      flex-shrink: 0;
      object-fit: contain;
    }
    .site-domain {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }
    .field-target {
      font-family: var(--font-code);
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-meta {
      font-family: var(--font-code);
      font-size: 11px;
      color: var(--text-dim);
      flex-shrink: 0;
    }
    .item-snippet {
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      user-select: text;
    }
    .action-bar {
      display: flex;
      gap: 6px;
      margin-top: 2px;
      padding-top: 6px;
      border-top: 1px solid var(--border-subtle);
    }
    .action-btn {
      flex: 1;
      padding: 2px 4px;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 150ms ease, border-color 150ms ease, color 150ms ease, transform 150ms ease;
      border: 1px solid transparent;
      background: transparent;
    }
    .action-btn:hover { transform: translateY(-1px); }
    .action-btn.primary {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: #FFFFFF;
    }
    .action-btn.primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }
    .action-btn.secondary {
      border: 1px solid var(--border);
      color: var(--text-main);
      background: transparent;
    }
    .action-btn.secondary:hover {
      background: var(--bg-panel);
      border-color: var(--accent-primary);
    }
    .action-btn.danger {
      border-color: transparent;
      color: var(--danger);
    }
    .action-btn.danger:hover {
      background: rgba(229,72,77,0.12);
      border-color: rgba(229,72,77,0.3);
    }
    .action-btn .pin-indicator {
      font-size: 12px;
      margin-right: 2px;
      color: var(--text-dim);
      transition: color 0.2s;
    }
    .item-row.pinned .pin-indicator { color: #F59E0B; }
    .settings-container {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--bg-main);
    }
    .settings-group {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .setting-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .setting-item-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .setting-label {
      font-size: 11px;
      color: var(--text-main);
      font-weight: 500;
      cursor: pointer;
    }
    .inline-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .checkbox-control {
      appearance: none;
      width: 14px;
      height: 14px;
      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      flex-shrink: 0;
      transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
    }
    .checkbox-control:hover {
      border-color: var(--accent-primary);
      transform: translateY(-1px);
    }
    .checkbox-control:checked {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
    }
    .checkbox-control:checked::after {
      content: '✓';
      color: #ffffff;
      font-size: 10px;
      font-weight: 900;
    }
    .text-input-sm {
      width: 60px;
      background: var(--bg-main);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-family: var(--font-code);
      font-size: 11px;
      padding: 2px 6px;
      text-align: right;
      border-radius: 2px;
      outline: none;
      transition: border-color 150ms ease, transform 150ms ease;
    }
    .text-input-flex {
      flex: 1;
      background: var(--bg-main);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-family: var(--font-code);
      font-size: 10px;
      padding: 3px 6px;
      border-radius: 2px;
      outline: none;
      transition: border-color 150ms ease, transform 150ms ease;
    }
    .text-input-sm:hover, .text-input-flex:hover,
    .text-input-sm:focus, .text-input-flex:focus {
      border-color: var(--accent-primary);
      transform: translateY(-1px);
    }
    .btn-sm {
      background: var(--bg-row);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 600;
      border-radius: 2px;
      cursor: pointer;
      transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
    }
    .btn-sm:hover {
      background: var(--bg-row-hover);
      border-color: var(--accent-primary);
      transform: translateY(-1px);
    }
    .btn-danger-sm {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--danger);
      padding: 2px 6px;
      font-size: 10px;
      font-weight: 600;
      border-radius: 2px;
      cursor: pointer;
      transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
    }
    .btn-danger-sm:hover {
      background: rgba(229,72,77,0.15);
      border-color: var(--danger);
      transform: translateY(-1px);
    }
    .domain-tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      max-height: 70px;
      overflow-y: auto;
      padding-top: 2px;
    }
    .domain-tag {
      font-family: var(--font-code);
      font-size: 10px;
      background: var(--bg-main);
      border: 1px solid var(--border);
      color: var(--accent-hover);
      padding: 2px 6px;
      border-radius: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: border-color 150ms ease, transform 150ms ease;
    }
    .domain-tag:hover {
      border-color: var(--accent-primary);
      transform: translateY(-1px);
    }
    .domain-tag.removed {
      text-decoration: line-through;
      color: var(--text-dim);
      border-color: var(--border-subtle);
      opacity: 0.6;
    }
    .tag-action-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 10px;
      line-height: 1;
      display: flex;
      align-items: center;
    }
    .tag-action-btn:hover { color: var(--danger); }
    .domain-tag.removed .tag-action-btn:hover { color: var(--accent-hover); }
    .save-btn {
      background: var(--accent-primary);
      color: #ffffff;
      border: 1px solid var(--accent-primary);
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      transition: background 150ms ease, border-color 150ms ease, transform 150ms ease;
    }
    .save-btn:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      transform: translateY(-1px);
    }
    footer {
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      padding: 4px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-dim);
      flex-shrink: 0;
    }
    .footer-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .footer-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 2px 6px;
      font-size: 10px;
      font-weight: 600;
      border-radius: 2px;
      cursor: pointer;
      transition: border-color 150ms ease, background 150ms ease, color 150ms ease, transform 150ms ease;
    }
    .footer-btn:hover {
      background: var(--bg-row-hover);
      color: var(--text-main);
      border-color: var(--accent-primary);
      transform: translateY(-1px);
    }
    .crypto-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--bg-main);
      border: 1px solid var(--border);
      color: var(--accent-hover);
      padding: 2px 6px;
      font-size: 10px;
      font-weight: 600;
      font-family: var(--font-code);
      border-radius: 2px;
      cursor: pointer;
      transition: border-color 150ms ease, background 150ms ease, color 150ms ease, transform 150ms ease;
    }
    .crypto-btn:hover {
      background: var(--bg-row-hover);
      border-color: var(--accent-hover);
      color: #ffffff;
      transform: translateY(-1px);
    }
    #lock-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10000;
      background: var(--bg-main);
      backdrop-filter: blur(4px);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px;
    }
    #lock-overlay.active { display: flex; }
    #lock-overlay .lock-icon { font-size: 40px; opacity: 0.6; }
    #lock-overlay h2 { font-weight: 600; font-size: 16px; color: var(--text-main); }
    #lock-overlay input {
      width: 60%;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 2px;
      text-align: center;
      font-size: 14px;
      outline: none;
    }
    #lock-overlay input:focus { border-color: var(--accent-primary); }
    #lock-overlay .btn-unlock {
      background: var(--accent-primary);
      border: none;
      color: #fff;
      padding: 6px 20px;
      font-weight: 600;
      border-radius: 2px;
      cursor: pointer;
      transition: background 150ms;
    }
    #lock-overlay .btn-unlock:hover { background: var(--accent-hover); }
    #lock-overlay .error-text { color: var(--danger); font-size: 11px; min-height: 16px; }
    .empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      color: var(--text-muted);
      gap: 8px;
      flex: 1;
    }
    .empty-state .empty-icon { font-size: 32px; opacity: 0.4; }
    .empty-state p { text-align: center; max-width: 240px; }
    .popup-empty .empty-state { display: flex; }
    .popup-empty main { display: none; }
    .popup-empty .tab-bar { display: none; }
    .popup-empty .filter-bar { display: none; }
    .version-modal, .pin-modal {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.65); z-index:10000;
      display:flex; align-items:center; justify-content:center;
      backdrop-filter:blur(2px);
    }
    .version-modal-content, .pin-modal-content {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      width: 90%;
      max-width: 340px;
      max-height: 380px;
      overflow-y: auto;
    }
    .version-header, .pin-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
    }
    .version-header .field-tag, .pin-header .field-tag {
      font-family: var(--font-code);
      font-size: 11px;
      color: var(--accent-primary);
    }
    .close-btn-icon {
      background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px;
    }
    .version-list { display: flex; flex-direction: column; gap: 8px; }
    .version-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 6px 0; border-bottom: 1px solid var(--border-subtle);
    }
    .version-snippet {
      flex: 1; font-size: 11px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .version-row .btn-primary {
      background: var(--accent-primary); border: none; color: #fff; padding: 2px 8px; font-size: 10px; border-radius: 2px; cursor: pointer;
    }
    .version-row .btn-primary:hover { background: var(--accent-hover); }
    .version-row .btn-secondary {
      background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 2px 8px; font-size: 10px; border-radius: 2px; cursor: pointer;
    }
    .version-row .btn-secondary:hover { border-color: var(--accent-primary); color: var(--text-main); }
    .crypto-modal {
      display: none;
      position: absolute;
      top:0; left:0; right:0; bottom:0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(2px);
      z-index:100;
      align-items:center; justify-content:center;
      padding:20px;
    }
    .crypto-modal.active { display: flex; }
    .crypto-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 2px;
      width:100%; max-width:280px;
      display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center;
    }
    .qr-placeholder {
      width:140px; height:140px; background:#ffffff; padding:6px; border:1px solid var(--border);
      display:flex; align-items:center; justify-content:center;
    }
    .qr-placeholder img { width:100%; height:100%; object-fit:contain; }
    .wallet-addr {
      font-family: var(--font-code); font-size:9px; color:var(--text-muted);
      background:var(--bg-main); padding:4px 6px; border:1px solid var(--border); word-break:break-all; width:100%;
    }
    .modal-close {
      background:transparent; border:1px solid var(--border); color:var(--text-muted);
      padding:3px 8px; font-size:10px; cursor:pointer; border-radius:2px;
      transition: border-color 150ms ease, background 150ms ease, color 150ms ease, transform 150ms ease;
    }
    .modal-close:hover { color:var(--text-main); background:var(--bg-row-hover); border-color:var(--accent-primary); transform:translateY(-1px); }
    .toast {
      position: fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(80px);
      background:var(--bg-panel); color:var(--text-main); font-size:12px; font-weight:500;
      padding:6px 14px; border-radius:20px; z-index:300; pointer-events:none; opacity:0;
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.25s ease;
      box-shadow:0 4px 16px rgba(0,0,0,0.3); display:flex; align-items:center; gap:10px;
    }
    .toast.visible { transform:translateX(-50%) translateY(0); opacity:1; pointer-events:auto; }
    .toast .undo-link { color:var(--accent-primary); cursor:pointer; font-weight:600; background:none; border:none; font-size:12px; }
  </style>
</head>
<body>

  <div id="lock-overlay">
    <div class="lock-icon">🔒</div>
    <h2>Vault Locked</h2>
    <input type="password" id="lock-pin-input" placeholder="Enter PIN" autofocus>
    <button class="btn-unlock" id="lock-unlock-btn">Unlock</button>
    <div class="error-text" id="lock-error"></div>
  </div>

  <header>
    <div class="brand">
      <svg class="brand-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a4 4 0 0 0-4 4c0 2.5 4 6 4 6s4-3.5 4-6a4 4 0 0 0-4-4z"></path>
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <line x1="12" y1="12" x2="12" y2="22"></line>
      </svg>
      <span id="header-title">LAZARUS</span>
    </div>
    <button class="icon-btn" id="settings-toggle-btn" title="Toggle Settings">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="21" x2="4" y2="14"></line>
        <line x1="4" y1="10" x2="4" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12" y2="3"></line>
        <line x1="20" y1="21" x2="20" y2="16"></line>
        <line x1="20" y1="12" x2="20" y2="3"></line>
        <line x1="1" y1="14" x2="7" y2="14"></line>
        <line x1="9" y1="8" x2="15" y2="8"></line>
        <line x1="17" y1="16" x2="23" y2="16"></line>
      </svg>
    </button>
  </header>

  <div class="view-panel" id="view-main">
    <div class="tab-bar">
      <button class="tab-btn active" id="tab-current">
        <img class="site-icon" id="current-favicon" src="https://www.google.com/s2/favicons?domain=example.com&sz=32" alt="">
        Current Site <span class="badge-count" id="current-badge">0</span>
      </button>
      <button class="tab-btn" id="tab-all">
        All Sites <span class="badge-count" id="all-badge">0</span>
      </button>
    </div>

    <div class="filter-bar">
      <input type="text" class="filter-input" id="filter-input" placeholder="Filter recoveries...">
    </div>

    <main id="entry-list"></main>

    <div class="empty-state" id="empty-state">
      <div class="empty-icon">📜</div>
      <p>No saved entries yet.<br>Type something in a form, and Lazarus will keep it safe.</p>
    </div>

    <footer>
      <div class="footer-actions">
        <button class="footer-btn" id="export-btn">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          Export
        </button>
        <button class="footer-btn" id="import-btn">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Import
        </button>
        <input type="file" id="import-file-input" accept=".json" style="display:none;">
      </div>
      <button class="crypto-btn" id="crypto-btn">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
          <path d="M14 14h3v3h-3z"></path>
          <path d="M18 18h3v3h-3z"></path>
        </svg>
        Donate
      </button>
    </footer>
  </div>

  <div class="view-panel hidden" id="view-settings">
    <div class="settings-container">
      <div class="settings-group">
        <div class="setting-item">
          <label class="setting-label" for="setting-savePasswords">Allow password fields</label>
          <input type="checkbox" class="checkbox-control" id="setting-savePasswords">
        </div>
        <div class="setting-item">
          <label class="setting-label" for="setting-restoreRequiresPassword">Require PIN for restore</label>
          <input type="checkbox" class="checkbox-control" id="setting-restoreRequiresPassword">
        </div>
      </div>

      <div class="settings-group">
        <div class="setting-item-col">
          <div class="setting-label">Security PIN</div>
          <div class="inline-group" style="flex-wrap:wrap; gap:4px;">
            <input type="password" class="text-input-sm" id="setting-current-pin" placeholder="Current" style="width:80px;">
            <input type="password" class="text-input-sm" id="setting-new-pin" placeholder="New" style="width:80px;">
            <input type="password" class="text-input-sm" id="setting-confirm-pin" placeholder="Confirm" style="width:80px;">
            <button class="btn-sm" id="setting-set-pin-btn">Set/Change</button>
            <button class="btn-danger-sm" id="setting-clear-pin">Delete</button>
          </div>
          <div style="font-size:10px; color:var(--text-dim); margin-top:2px;">
            <span id="pin-status">No PIN set</span>
          </div>
        </div>
      </div>

      <div class="settings-group">
        <div class="setting-item">
          <label class="setting-label" for="setting-retentionHours">Retention (hours, 0=never)</label>
          <input type="number" class="text-input-sm" id="setting-retentionHours" min="0">
        </div>
        <div class="setting-item">
          <label class="setting-label" for="setting-minChar">Min char threshold</label>
          <input type="number" class="text-input-sm" id="setting-minChar" min="1" value="4">
        </div>
        <div class="setting-item">
          <label class="setting-label" for="setting-captureRich">Capture rich text (ContentEditable)</label>
          <input type="checkbox" class="checkbox-control" id="setting-captureRich" checked>
        </div>
        <div class="setting-item">
          <label class="setting-label" for="setting-autoPurge">Auto-purge on browser exit</label>
          <input type="checkbox" class="checkbox-control" id="setting-autoPurge">
        </div>
      </div>

      <div class="settings-group">
        <div class="setting-item">
          <label class="setting-label" for="setting-searchIndexing">Enable search & history</label>
          <input type="checkbox" class="checkbox-control" id="setting-searchIndexing">
        </div>
        <div class="setting-item">
          <label class="setting-label" for="setting-showBadge">Show badge count on icon</label>
          <input type="checkbox" class="checkbox-control" id="setting-showBadge" checked>
        </div>
        <div class="setting-item-col">
          <div class="setting-label">Excluded domains (blacklist)</div>
          <div class="inline-group">
            <input type="text" class="text-input-flex" id="new-domain-input" placeholder="e.g. bank.com">
            <button class="btn-sm" id="add-domain-btn">Add</button>
          </div>
          <div class="domain-tags-container" id="domain-tags-container"></div>
        </div>
      </div>

      <button class="save-btn" id="save-settings-btn">Save Settings</button>
    </div>
  </div>

  <div class="crypto-modal" id="crypto-modal">
    <div class="crypto-card">
      <div style="font-weight:700; font-size:11px; letter-spacing:0.5px;">DONATE VIA CRYPTO</div>
      <div class="qr-placeholder"><img src="donate-qr.png" alt="QR"></div>
      <div class="wallet-addr">HDnhGVB3JGBjnYy8acuhohTPUNgMHRKv3p4CsK7T1dCK</div>
      <button class="modal-close" id="crypto-modal-close">Close</button>
    </div>
  </div>

  <div class="toast" id="toast"><span id="toastMsg"></span><button class="undo-link" id="toastUndo">Undo</button></div>

  <script src="popup.js"></script>
</body>
</html>
