<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg-main: #09090b;
      --bg-card: #18181b;
      --border: #27272a;
      --accent: #d97706;
      --text-primary: #f4f4f5;
      --text-secondary: #a1a1aa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-main); color: var(--text-primary); padding: 20px; max-width: 500px; margin: 0 auto; }
    h1 { font-size: 18px; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .setting { margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
    label { font-size: 14px; color: var(--text-secondary); }
    input[type="number"] { width: 80px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); padding: 4px 8px; border-radius: 4px; }
    input[type="checkbox"] { accent-color: var(--accent); width: 18px; height: 18px; }
    button { background: var(--accent); color: #000; font-weight: 600; padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    .saved { color: #22c55e; font-size: 12px; margin-left: 10px; display: none; }
  </style>
</head>
<body>
  <h1>Lazarus Settings</h1>
  <div class="setting">
    <label for="savePasswords">Allow password fields</label>
    <input type="checkbox" id="savePasswords">
  </div>
  <div class="setting">
    <label for="retentionHours">Retention (hours, 0 = never)</label>
    <input type="number" id="retentionHours" min="0" max="8760">
  </div>
  <div class="setting">
    <label for="restoreRequiresPassword">Require PIN for restore</label>
    <input type="checkbox" id="restoreRequiresPassword">
  </div>
  <div class="setting">
    <label for="searchIndexing">Enable search & history</label>
    <input type="checkbox" id="searchIndexing">
  </div>
  <button id="save">Save Settings</button>
  <span id="status" class="saved">Saved!</span>
  <script src="options.js"></script>
</body>
</html>
